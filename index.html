<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4C24B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sourdough">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>Sourdough, planned backwards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="t-y" data-view="import">
  <header id="top" hidden>
    <button type="button" class="ib" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><span id="topTitle"></span><div class="dots" id="dots" hidden><i></i><i></i><i></i></div></div>
    <button type="button" class="ib" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
  </header>

  <!-- 1. RECIPE: import -->
  <main id="view-import" class="screen" hidden>
    <div class="photo" data-img="dough_00"></div>
    <h1 data-i18n="imp.title"></h1>
    <p class="sub" data-i18n="imp.sub"></p>
    <div id="lastBox" hidden>
      <div class="label" data-i18n="imp.last"></div>
      <div class="card"><button type="button" class="row" id="lastBtn"><span><b id="lastName"></b><br><span class="soft small" id="lastSub"></span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
      <button type="button" class="textlink" id="lastOthers" data-i18n="imp.others" hidden></button>
      <div class="label" data-i18n="imp.new"></div>
    </div>
    <div class="card pad"><textarea id="recipeText" rows="6" data-i18n-ph="recipe.placeholder"></textarea></div>
    <div id="importMsg" class="msgs"></div>
    <button type="button" class="textlink" id="aiLink" data-i18n="imp.aiLink"></button>
    <div class="cta-wrap">
      <button type="button" class="btn" id="readText" data-i18n="imp.read"></button>
      <button type="button" class="btn txt" id="useSample" data-i18n="imp.example"></button>
    </div>
  </main>

  <main id="view-ai" class="screen" hidden>
    <h1 data-i18n="ai.title"></h1>
    <p class="sub" data-i18n="ai.sub"></p>
    <div class="card">
      <div class="how"><div class="num">1</div><div><b data-i18n="ai.s1"></b><br><span class="soft" data-i18n="ai.s1b"></span></div></div>
      <div class="how"><div class="num">2</div><div><b data-i18n="ai.s2"></b><br><span class="soft" data-i18n="ai.s2b"></span></div></div>
      <div class="how"><div class="num">3</div><div><b data-i18n="ai.s3"></b><br><span class="soft" data-i18n="ai.s3b"></span></div></div>
    </div>
    <div class="card pad"><textarea id="recipeJson" rows="4" data-i18n-ph="recipe.answerPlaceholder"></textarea></div>
    <div id="aiMsg" class="msgs"></div>
    <div class="cta-wrap">
      <button type="button" class="btn sec" id="copyPrompt" data-i18n="recipe.copy"></button>
      <button type="button" class="btn" id="readJson" data-i18n="recipe.readAnswer"></button>
    </div>
  </main>

  <!-- 1. RECIPE: card -->
  <main id="view-card" class="screen" hidden>
    <div class="photo" data-img="mood_00"></div>
    <h1 id="cardTitle"></h1>
    <p class="sub" id="cardSub"></p>
    <div id="cardLeaven"></div>
    <div class="label" data-i18n="ing.dough"></div>
    <div class="card" id="cardList"></div>
    <div class="card">
      <button type="button" class="row" id="cardEdit"><span data-i18n="card.edit"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button type="button" class="row" id="cardOther"><span data-i18n="card.other"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="cta-wrap"><button type="button" class="btn" id="cardContinue" data-i18n="card.continue"></button></div>
  </main>

  <main id="view-review" class="screen" hidden>
    <h1 data-i18n="review.title"></h1>
    <label class="field"><span class="label" data-i18n="review.name"></span><input type="text" id="rvName"></label>
    <div class="label" data-i18n="review.ingredients"></div>
    <div id="rvIng" class="rows"></div>
    <button type="button" class="textlink" id="rvAdd" data-i18n="review.addIng"></button>
    <div class="label" data-i18n="review.steps"></div>
    <div id="rvSteps" class="rows"></div>
    <div id="rvMsg" class="msgs"></div>
    <div class="cta-wrap">
      <button type="button" class="btn" id="rvSave" data-i18n="review.save"></button>
      <button type="button" class="btn txt" id="rvBack" data-i18n="review.back"></button>
    </div>
  </main>

  <main id="view-recipes" class="screen" hidden>
    <h1 data-i18n="rec.title"></h1>
    <div class="card" id="recipeList"></div>
    <div class="cta-wrap"><button type="button" class="btn" id="recNew" data-i18n="rec.new"></button></div>
  </main>

  <!-- 2. WHEN -->
  <main id="view-home" class="screen" hidden>
    <div class="photo" data-img="loaf_00"></div>
    <h1 data-i18n="when.title"></h1>
    <div class="opt" id="optNow" role="radio" tabindex="0"><div class="radio"></div><div><h3 data-i18n="when.nowTitle"></h3><p id="nowText"></p></div></div>
    <div class="opt" id="optPick" role="radio" tabindex="0">
      <div class="radio"></div>
      <div class="grow"><h3 data-i18n="when.pickTitle"></h3><p data-i18n="when.pickText"></p>
        <div id="pickBox" hidden>
          <input type="datetime-local" id="target" step="900">
          <div class="chips" id="quickDates"></div>
        </div>
      </div>
    </div>
    <div class="recipe-row"><span><span class="soft" data-i18n="home.recipe"></span> <b id="recipeName"></b></span><button type="button" class="textlink inline" id="changeRecipe" data-i18n="home.change"></button></div>
    <button type="button" class="textlink" id="goCustom"><span data-i18n="when.customize"></span> · <span class="soft" data-i18n="when.customizeSub"></span></button>
    <div id="whenMsg" class="msgs"></div>
    <div class="cta-wrap"><button type="button" class="btn" id="homeContinue" data-i18n="card.continue"></button></div>
  </main>

  <main id="view-advanced" class="screen" hidden>
    <h1 data-i18n="cu.title"></h1>
    <p class="sub" data-i18n="cu.sub"></p>
    <div class="label" data-i18n="cu.amount"></div>
    <div class="chips" id="sizes"></div>
    <div class="label" data-i18n="cu.kitchen"></div>
    <div class="seg" id="kitchenSeg"></div>
    <p class="hint" data-i18n="home.tempHint"></p>
    <div id="feedsBox"><div class="label" data-i18n="cu.feeds"></div><div class="seg" id="feedsSeg"></div></div>
    <div class="label" data-i18n="cu.night"></div>
    <div class="card">
      <label class="row"><span><b data-i18n="cu.nightWarn"></b><br><span class="soft small" id="nightWindow"></span></span>
        <input type="checkbox" id="quietOn" class="switch"></label>
      <div class="row times" id="quietRow"><input type="time" id="quietStart" step="900"><span class="soft" data-i18n="home.to"></span><input type="time" id="quietEnd" step="900"></div>
    </div>
    <div class="cta-wrap"><button type="button" class="btn" id="advDone" data-i18n="cu.done"></button></div>
  </main>

  <!-- 3. CONFIRM -->
  <main id="view-confirm" class="screen" hidden>
    <div class="mcard">
      <div class="photo in" data-img="dough_01"></div>
      <div class="k" data-i18n="cf.ready"></div>
      <div class="big" id="cfReady"></div>
      <p class="line" id="cfStarts"></p>
    </div>
    <div id="cfNotes"></div>
    <div class="cta-wrap" id="cfButtons"></div>
  </main>

  <!-- 4. COOK -->
  <main id="view-now" class="screen cook" hidden>
    <div class="carousel" id="nowCarousel"></div>
    <div class="mcard" id="nowEmpty" hidden><div class="name" id="nowEmptyText"></div></div>
    <div class="cta-wrap above-tabs">
      <button type="button" class="btn" id="nowDone" hidden></button>
      <button type="button" class="btn sec" id="nowBack" hidden data-i18n="now.backToCurrent"></button>
    </div>
  </main>

  <main id="view-plan" class="screen cook" hidden>
    <h1 data-i18n="plan.title"></h1>
    <p class="sub" id="planSub"></p>
    <div id="notices"></div>
    <div class="seg" id="dayTabs" role="tablist"></div>
    <div class="card"><ol id="timeline" class="timeline"></ol></div>
    <p class="hint" id="icsHelp" hidden></p>
  </main>

  <main id="view-ingredients" class="screen cook" hidden>
    <h1 id="ingTitle"></h1>
    <p class="sub" id="ingSub"></p>
    <div id="ingLeaven"></div>
    <div id="ingBody"></div>
  </main>

  <nav id="tabs" hidden>
    <button type="button" data-tab="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="tab.now"></span></button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span data-i18n="tab.plan"></span></button>
    <button type="button" data-tab="ingredients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span data-i18n="tab.ing"></span></button>
  </nav>

  <div id="scrim" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="i18n.js"></script>
  <script src="calc.js"></script>
  <script src="recipeimport.js"></script>
  <script src="ics.js"></script>
  <script src="recipe.js"></script>
  <script src="convert.js"></script>
  <script src="flow.js"></script>
  <script src="planner.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      navigator.serviceWorker.register('sw.js').then(function (reg) { reg.update(); }).catch(function () {});
    }
  </script>
</body>
</html>
