<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c130d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sourdough">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>Sourdough, planned backwards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="veil" id="veil"></div>

  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <span aria-hidden="true">·</span>
    <button type="button" data-lang="it" aria-pressed="false">IT</button>
  </div>

  <button type="button" class="help" id="helpBtn" aria-label="How it works" data-i18n-aria="home.how">?</button>
  <button type="button" class="help peek" id="peekBtn" aria-label="Show the photo" data-i18n-aria="home.peek">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>

  <!-- INTRO -->
  <main id="view-intro" class="screen" hidden>
    <div class="stack">
      <h1 data-i18n="intro.title"></h1>
      <p class="lead" data-i18n="intro.lead"></p>
      <ol class="points">
        <li data-i18n="intro.p1"></li>
        <li data-i18n="intro.p2"></li>
        <li data-i18n="intro.p3"></li>
      </ol>
      <button type="button" class="cta" id="introGo" data-i18n="intro.go"></button>
    </div>
  </main>

  <!-- SETUP -->
  <main id="view-home" class="screen">
    <div class="stack">
      <h1 data-i18n="home.title"></h1>

      <form id="form" autocomplete="off">
        <div class="field">
          <label class="label" for="target" data-i18n="home.ready"></label>
          <input type="datetime-local" id="target" step="900" required>
          <div class="quick"><span id="quickDates"></span><button type="button" id="startNowBtn" class="startnow-pill"><span data-i18n="home.startNow"></span> <i aria-hidden="true">→</i></button></div>
        </div>

        <div class="startnow">
          <div id="startNowOut" class="startnow-out" hidden>
            <p id="startNowText"></p>
            <button type="button" id="startNowGo" class="cta small" data-i18n="home.startNowGo"></button>
          </div>
        </div>

        <fieldset class="field">
          <legend class="label" data-i18n="home.feeds"></legend>
          <div id="presets" class="seg"></div>
          <p class="optdesc" id="presetDesc"></p>
        </fieldset>

        <div class="field">
          <span class="label" data-i18n="home.size"></span>
          <div id="sizes" class="seg"></div>
        </div>

        <div class="recipe-row">
          <span><span class="label" data-i18n="home.recipe"></span> <b id="recipeName"></b></span>
          <button type="button" id="changeRecipe" class="link" data-i18n="home.change"></button>
        </div>

        <button type="button" id="detailsBtn" class="link" aria-expanded="false"><span data-i18n="home.details"></span> <i aria-hidden="true">+</i></button>
        <div id="details" class="details" hidden>
          <label class="field">
            <span class="label"><span data-i18n="home.temp"></span> <b id="tempOut">22</b> °C</span>
            <input type="range" id="temp" min="16" max="30" step="1" value="22">
            <span class="hint" data-i18n="home.tempHint"></span>
          </label>
          <label class="field">
            <span class="label"><span data-i18n="home.ddt"></span> <b id="ddtOut">25</b> °C</span>
            <input type="range" id="ddt" min="22" max="28" step="1" value="25">
          </label>
          <div class="field">
            <label class="switch">
              <input type="checkbox" id="quietOn" checked>
              <span class="trk" aria-hidden="true"></span>
              <span data-i18n="home.quiet"></span>
            </label>
            <div id="quietRow" class="quiet-row">
              <label><span data-i18n="home.from"></span> <input type="time" id="quietStart" value="23:00" step="900"></label>
              <label><span data-i18n="home.to"></span> <input type="time" id="quietEnd" value="07:00" step="900"></label>
            </div>
          </div>
        </div>

        <button type="submit" class="cta" data-i18n="home.plan"></button>
      </form>
    </div>
  </main>

  <!-- IMPORT -->
  <main id="view-import" class="screen" hidden>
    <div class="stack">
      <h1 data-i18n="recipe.title"></h1>
      <p class="hint" data-i18n="recipe.help"></p>
      <div id="importText" class="ipane">
        <textarea id="recipeText" rows="7" data-i18n-ph="recipe.placeholder"></textarea>
        <div class="irow"><button type="button" class="cta" id="readText" data-i18n="recipe.read"></button><button type="button" class="link" id="useSample" data-i18n="recipe.example"></button></div>
      </div>
      <button type="button" class="link" id="aiToggle" data-i18n="recipe.aiToggle"></button>
      <div id="importAi" class="ipane" hidden>
        <p class="hint" data-i18n="recipe.aiHelp"></p>
        <button type="button" class="cta small" id="copyPrompt" data-i18n="recipe.copy"></button>
        <textarea id="recipeJson" rows="6" data-i18n-ph="recipe.answerPlaceholder"></textarea>
        <div class="irow"><button type="button" class="cta" id="readJson" data-i18n="recipe.readAnswer"></button></div>
      </div>
      <div id="importMsg" class="msgs"></div>
      <p class="hint" data-i18n="recipe.privacy"></p>
      <button type="button" class="ghost" id="importCancel" data-i18n="recipe.cancel" hidden></button>
    </div>
  </main>

  <!-- REVIEW -->
  <main id="view-review" class="screen scroll" hidden>
    <div class="plan-wrap">
      <h2 data-i18n="review.title"></h2>
      <div class="rv-cols">
        <div class="rv-left">
          <label class="field"><span class="label" data-i18n="review.name"></span><input type="text" id="rvName"></label>
          <div class="label" data-i18n="review.ingredients"></div>
          <div id="rvIng" class="rows"></div>
          <button type="button" class="link" id="rvAdd" data-i18n="review.addIng"></button>
        </div>
        <div class="rv-right">
          <div class="label" data-i18n="review.steps"></div>
          <div id="rvSteps" class="rows"></div>
          <div id="rvMsg" class="msgs"></div>
        </div>
      </div>
      <div class="foot"><button type="button" class="cta" id="rvSave" data-i18n="review.save"></button><button type="button" class="ghost" id="rvBack" data-i18n="review.back"></button></div>
    </div>
  </main>

  <!-- SAME RECIPE? -->
  <main id="view-again" class="screen" hidden>
    <div class="stack">
      <h1 id="againTitle"></h1>
      <div id="againMain">
        <button type="button" class="cta" id="againSame" data-i18n="again.same"></button>
        <button type="button" class="ghost" id="againOther" data-i18n="again.other"></button>
      </div>
      <div id="againList" hidden>
        <div class="label" data-i18n="again.pick"></div>
        <div id="againRecipes" class="seg"></div>
        <button type="button" class="link" id="againNew" data-i18n="again.new"></button>
      </div>
    </div>
  </main>

  <!-- INGREDIENTS -->
  <main id="view-ingredients" class="screen scroll" hidden>
    <div class="plan-wrap">
      <button type="button" class="ghost back" id="ingBack" data-i18n="plan.back"></button>
      <h2 id="ingTitle"></h2>
      <div id="ingBody"></div>
    </div>
  </main>

  <!-- NOW -->
  <main id="view-now" class="screen" hidden>
    <div class="stack center">
      <p class="label" id="nowEyebrow"></p>
      <p class="serif step-name" id="nowName"></p>
      <div class="when" id="when">
        <span class="when-day" id="whenDay"></span>
        <span class="when-time" id="whenTime"></span>
      </div>
      <p class="sub" id="nowSub"></p>
      <p class="need" id="nowNeed" hidden></p>
      <div class="track"><i id="trackFill"></i></div>
      <div class="howto" id="nowHow" hidden>
        <p id="nowInstr"></p>
        <p class="serif" id="nowSignal"></p>
      </div>
      <div class="row">
        <button type="button" class="cta" id="nowDone" data-i18n="now.done" hidden></button>
        <button type="button" class="ghost" id="toPlan" data-i18n="now.plan"></button>
        <button type="button" class="ghost" id="toIng" data-i18n="now.ingredients"></button>
        <button type="button" class="ghost" id="toHome" data-i18n="now.edit"></button>
      </div>
    </div>
  </main>

  <!-- PLAN -->
  <main id="view-plan" class="screen scroll" hidden>
    <div class="plan-wrap">
      <button type="button" class="ghost back" id="back" data-i18n="plan.back"></button>
      <h2 id="planTitle"></h2>
      <p id="planSub"></p>
      <div id="notices"></div>
      <div class="plan-bar">
        <div id="dayTabs" class="tabs" role="tablist"></div>
        <div class="foot">
          <button type="button" class="cta small" id="icsBtn" data-i18n="plan.calendar"></button>
          <button type="button" class="ghost" id="toIng2" data-i18n="now.ingredients"></button>
          <button type="button" class="ghost" id="reset" data-i18n="plan.reset"></button>
        </div>
      </div>
      <p class="hint" id="icsHelp" hidden></p>
      <ol id="timeline" class="timeline"></ol>
    </div>
  </main>

  <footer class="bottom" id="bottom">
    <p class="quote" id="quote"><q></q><cite></cite></p>
    <p class="credit" id="credit"></p>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="i18n.js"></script>
  <script src="calc.js"></script>
  <script src="recipeimport.js"></script>
  <script src="ics.js"></script>
  <script src="recipe.js"></script>
  <script src="planner.js"></script>
  <script src="images.js"></script>
  <script src="images.local.js" onerror="void 0"></script>
  <script src="quotes.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      navigator.serviceWorker.register('sw.js').then(function (reg) { reg.update(); }).catch(function () {});
    }
  </script>
</body>
</html>
